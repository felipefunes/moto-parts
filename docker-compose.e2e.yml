# Backend + Postgres for the E2E harness (see e2e/README.md). Playwright's webServer config
# drives this up/down -- it's not meant to be run by hand.
#
# Assumes rpm-parts-backend is checked out as a sibling directory of this repo
# (../rpm-parts-backend). That's a real limitation, not an oversight: this harness predates any
# real staging environment (see RELEASING.md discussion) and cross-repo CI checkout needs a
# decision on how the frontend's CI authenticates to the private backend repo -- deferred until
# that's worth building. For now, this is a local/dev tool.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rpm_parts
      POSTGRES_USER: rpm_parts
      POSTGRES_PASSWORD: rpm_parts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpm_parts"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Added alongside the backend's accounts/auth module (its own compose.yaml gained this at the
  # same time) -- the backend now requires Redis for refresh tokens, on every request, not just
  # from auth endpoints once the frontend has a login page. No volume, matching the backend's own
  # compose.yaml: refresh tokens are meant to be disposable, and this is an ephemeral E2E run
  # anyway.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ../rpm-parts-backend
    ports:
      - "18080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rpm_parts
      SPRING_DATASOURCE_USERNAME: rpm_parts
      SPRING_DATASOURCE_PASSWORD: rpm_parts
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # Required since the backend's accounts/auth module (rpm-parts-backend PR #27): with no
      # default anywhere outside that repo's own local dev/test profiles, the container now exits
      # immediately at startup without this -- never binds :18080, and this harness's webServer
      # health-check poll (playwright.config.ts) just times out with no clue why. Any string
      # works here; this is an ephemeral E2E container, not a real deployment, so the value itself
      # carries no real risk the way a committed production secret would.
      APP_JWT_SECRET: insecure-e2e-only-secret-never-used-outside-this-disposable-container
      # Also required as of the same PR: app.cors.allowed-origins has no default either (empty by
      # default in every profile now, not just "prod" -- see that repo's application.properties
      # comment), so without this every cross-origin call from the frontend dev server
      # (playwright.config.ts's frontendUrl, http://localhost:5173) would fail with a CORS error
      # -- not just the new auth endpoints, catalog/cart/checkout too, since they're all
      # cross-origin from the frontend's point of view.
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
